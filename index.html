<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden">
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// --- ШАР + ШЕЙДЕР ---
const geo = new THREE.SphereGeometry(1, 64, 64);

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vPos;
    
    
    
    
    
    
    
    
    
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPos;








vec3 Hash3(vec3 p) {
    p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
             dot(p, vec3(269.5, 183.3, 246.1)),
             dot(p, vec3(113.5, 271.9, 124.6)));
    return fract(sin(p) * 43758.5453);
}











float voronoi3D(vec3 wc) {
	vec3 cell = floor(wc);
	vec3 loc = fract(wc);

	float minDist = 100.0;


	for (int y=-1; y <= 1; y++) {
		for (int x=-1; x <= 1; x++) {
			for (int z=-1; z <= 1; z++) {
				vec3 pos = cell + vec3(x, y, z);
				vec3 wpos = pos + Hash3(pos);

				float dist = distance(wpos, wc);



				minDist = min(minDist, dist);
			}
		}
	}

	return minDist;
}
    









    void main() {
      
      
      float n = voronoi3D(vPos*10.0 + uTime);
      
      
      vec3 color = mix( vec3(0.82, 0.27, 0), vec3(0.9, 0.8, 0), n);
      
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const sphere = new THREE.Mesh(geo, mat);
scene.add(sphere);
camera.position.z = 3;




const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;   // плавное «доезжание» после отпускания пальца
controls.dampingFactor = 0.08;
controls.enablePan = false;      // отключаем сдвиг сцены (для шара не нужен)
controls.minDistance = 1.5;      // лимиты зума
controls.maxDistance = 8;











// --- АНИМАЦИЯ ---
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  sphere.rotation.y += 0.01;
  sphere.rotation.x += 0.0005;
  mat.uniforms.uTime.value = t;

   
   
   
   
   const sc = 0.7 + Math.cos(t*2.4)*0.07;
   sphere.scale.set(sc, sc, sc);


  controls.update();
  renderer.render(scene, camera);
}
animate();

// чтобы не растягивалось при ресайзе окна
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
